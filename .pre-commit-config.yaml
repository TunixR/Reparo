# `pre-commit install` installs both hook types below. CI runs the same hooks (lint.yml).
# Every tool is a dev dependency, so uv.lock sets its version here, in CI and on the command line.
# Each one is configured in pyproject.toml, except jscpd (.jscpd.json, .jscpd-tests.json).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (linter)
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff (formatter)
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  # Security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        name: bandit (security check)
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright (type checking)
        entry: uv run basedpyright -p pyproject.toml --level error
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: import-linter
        name: import-linter (package layers and import cycles)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: '(\.py|^pyproject\.toml)$'

      - id: deptry
        name: deptry (imports match declared dependencies)
        entry: uv run deptry .
        language: system
        pass_filenames: false
        files: '(\.py|^pyproject\.toml|^uv\.lock)$'

      - id: vulture
        name: vulture (unused code)
        entry: uv run vulture
        language: system
        pass_filenames: false
        files: '(\.py|^pyproject\.toml)$'

      - id: complexipy
        name: complexipy (cognitive complexity)
        entry: uv run complexipy
        language: system
        pass_filenames: false
        files: '(\.py|^pyproject\.toml|^complexipy-snapshot\.json)$'

      - id: jscpd
        name: jscpd (duplicated code)
        entry: uv run jscpd --no-colors
        language: system
        pass_filenames: false
        files: '(\.py|^\.jscpd(-baseline)?\.json)$'

      - id: jscpd-tests
        name: jscpd (duplicated code in tests)
        # Tests repeat their setup more than code should, so only longer blocks count.
        entry: uv run jscpd --no-colors --config .jscpd-tests.json
        language: system
        pass_filenames: false
        files: '(^tests/.*\.py|^\.jscpd-tests(-baseline)?\.json)$'

      - id: pytest-unit
        name: pytest (unit tests only)
        entry: uv run pytest tests/unit -q
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: conventional-commit
        name: conventional commit message
        # Same vocabulary as PR titles and labels: CONTRIBUTING.md -> Commits.
        entry: uv run python .github/scripts/conventions.py check-commit
        language: system
        stages: [commit-msg]
