[project]
name = "reparo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "sqlmodel>=0.0.50",
    "strands-agents[openai,otel]>=1.65.0",
    "strands-agents-tools>=0.8.5",
    "strands-agents-evals>=1.10.0",
    "pillow>=12.3.0",
    "numpy>=2.5.5",
    "scikit-image>=0.25.2",
    "opencv-python-headless>=5.1.0.95",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
    "alembic>=1.19.1",
    "aioboto3>=7.0.0",
    "scalar-fastapi>=1.10.0",
    "pytest-cov>=7.0.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "bcrypt>=5.0.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.9.0",
    "websockets>=17.0.1",
    "regex>=2026.11.15",
    "opentelemetry-instrumentation-logging>=0.66b2",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.3",
    "basedpyright>=1.39.9",
    "ruff>=0.17.5",
]
temp = [
    "opencv-python-headless>=5.1.0.95",
    "scikit-image>=0.25.2",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv", "evals"]

[tool.basedpyright]
exclude = ["**/migrations", "**/.*", "**/__pycache__", "**/tests/unit/shared"]
reportMissingTypeStubs = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportIncompatibleMethodOverride = false
reportAny = false
reportExplicitAny = false
reportUnannotatedClassAttribute = false
reportImportCycles = "warning"
reportCallInDefaultInitializer = false
# Only errors fail the check, as `--level error` intends. Under GitHub Actions basedpyright still
# counts warnings (as annotations) and would fail on them otherwise.
failOnWarnings = false
