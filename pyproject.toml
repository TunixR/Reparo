[project]
name = "reparo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "psycopg2-binary>=2.9.12",
    "sqlmodel>=0.0.50",
    "strands-agents[openai,otel]>=1.65.0",
    "strands-agents-evals>=1.10.0",
    "pillow>=12.3.0",
    "numpy>=2.5.5",
    "alembic>=1.19.1",
    "aioboto3>=7.0.0",
    "scalar-fastapi>=1.10.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "bcrypt>=5.0.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.9.0",
    "websockets>=17.0.1",
    "regex>=2026.11.15",
    "opentelemetry-instrumentation-logging>=0.66b2",
    "defusedxml>=0.7.1",
    "botocore>=1.40.61",
    "python-dotenv>=1.2.4",
    "pyjwt>=2.15.1",
    "pydantic>=2.14.2",
    "pydantic-core>=2.50.2",
    "httpx>=0.28.1",
    "sqlalchemy>=2.1.6",
    "starlette>=1.10.0",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.3",
    "basedpyright>=1.39.9",
    "complexipy>=9.0.0",
    "deptry>=0.25.1",
    "import-linter>=2.17",
    "jscpd>=5.4.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.5",
    "vulture>=2.16",
]

[tool.ruff.lint]
# On top of ruff's default rule set. Each family is here for what review would otherwise catch.
extend-select = [
    "ARG",      # arguments nothing reads
    "ASYNC",    # blocking calls and timeouts in async code
    "B",        # likely bugs (the bugbear rules the defaults leave out)
    "DTZ",      # datetimes without a timezone
    "ERA",      # commented-out code
    "PERF",     # needless work in loops
    "PGH",      # blanket `# type: ignore` and `# noqa`: a suppression names its rule
    "PIE",      # needless code
    "PLC0415",  # imports inside functions, the usual patch over an import cycle
    "PLR0915",  # functions too long to read
    "PLR1714",  # repeated equality comparisons
    "PLW",      # constructs that are probably mistakes
    "RET",      # needless return and else
    "RUF",      # ruff's own checks, with unused `# noqa` (RUF100) and dangling tasks (RUF006)
    "SIM",      # code that has a simpler form
    "SLF",      # reaching into another object's private members
    "T20",      # print and pprint left behind
    "TRY300",   # a return inside try that belongs in else
    "TRY400",   # logging.error where logging.exception keeps the traceback
]

[tool.ruff.lint.per-file-ignores]
# By design: fixtures and mocks take arguments they don't read, and tests reach into internals.
"tests/**" = ["ARG", "SLF001", "PLC0415", "PLR0915"]
# By design: command-line programs print.
"evals/**" = ["T201"]
"scripts/**" = ["T201"]
"populate.py" = ["T201"]
"database/populators/**" = ["T201"]
".github/scripts/**" = ["T201"]
# By design: Alembic writes its operations as comments.
"migrations/**" = ["ERA001"]
# By design: Strands passes the event to these hook callbacks, and `_tools` is the empty default of
# a hook `gui/tooled.py` overrides.
"agent_tools/hooks.py" = ["ARG002"]
"database/agents/behaviours/gui/base.py" = ["ARG002"]
# By design: Strands has no public setter for its tracer.
"observability/instrumentation/genai.py" = ["SLF001"]
# By design: a lazy `__getattr__` import, so the submodules import without pyautogui (which needs a
# display at import time).
"scripts/recovery_ws_client/__init__.py" = ["PLC0415"]
# Debt: what these files broke when the rules above were turned on. Fix a file, then delete its
# line; never add one. New code follows the rules.
"migrations/versions/0008_ui_recovery_default_graph.py" = ["T201"]

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv", "evals"]

[tool.basedpyright]
exclude = ["**/migrations", "**/.*", "**/__pycache__", "**/tests/unit/shared"]
reportMissingTypeStubs = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportIncompatibleMethodOverride = false
reportAny = false
reportExplicitAny = false
reportUnannotatedClassAttribute = false
reportImportCycles = "warning"
reportCallInDefaultInitializer = false
# Only errors fail the check, as `--level error` intends. Under GitHub Actions basedpyright still
# counts warnings (as annotations) and would fail on them otherwise.
failOnWarnings = false

[tool.deptry]
# Compares the imports in the code with the dependencies declared above.

[tool.deptry.per_rule_ignores]
# DEP002, a declared dependency nothing imports. By design: SQLAlchemy loads psycopg2 from the
# database URL.
DEP002 = ["psycopg2-binary"]

[tool.importlinter]
# Which package may import which. The top-level modules (main, populate, settings) are
# not packages, so the contracts don't cover them.
root_packages = [
    "routers",
    "evals",
    "scripts",
    "middlewares",
    "database",
    "agent_tools",
    "observability",
    "robot",
    "security",
    "s3",
    "templates",
    "gateway",
    "modules",
]

[[tool.importlinter.contracts]]
name = "Packages import downwards only"
type = "layers"
# A package imports only from the rows below its own. Packages on one row (joined by `:`) may
# import each other.
layers = [
    "routers : evals : scripts",
    "middlewares",
    "database",
    "agent_tools : observability",
    "robot : security : s3",
    "templates",
]
# Debt: the upward imports that existed when this contract was written. They are what makes
# `database` and these two packages depend on each other. Remove an import, then delete its line
# (a line that matches nothing fails the check); never add one.
ignore_imports = [
    "agent_tools.hooks -> database.agent_graphs.runner",
    "agent_tools.hooks -> database.engine",
    "agent_tools.hooks -> database.logging.models",
    "observability.instrumentation.agent_graph -> database.agent_graphs.runner",
    "observability.instrumentation.recovery -> database.logging.models",
]

[[tool.importlinter.contracts]]
name = "No import cycles inside a package"
type = "acyclic_siblings"
# The modules and subpackages inside each of these must not import each other in a circle.
ancestors = [
    "routers",
    "evals",
    "scripts",
    "middlewares",
    "database",
    "agent_tools",
    "observability",
    "robot",
    "security",
    "s3",
    "templates",
]
# Debt: the imports that close the cycles in `database` today. Same rule as above.
ignore_imports = [
    "database.agent_graphs.runner -> database.agent_graphs.models",
    "database.agent_graphs.runner -> database.logging.agent_graph_tracing",
    "database.agents.behaviours.base -> database.agent_graphs.runner",
]

[tool.vulture]
# Functions, classes, attributes and variables nothing uses. The tests count as users.
paths = ["."]
# scripted_model.py: its `raise` before `yield` is how a stub becomes an async generator.
exclude = [".venv/", "migrations/", "tests/unit/shared/scripted_model.py"]
min_confidence = 60
# By design: the framework calls what these decorate.
ignore_decorators = [
    "@router.*",
    "@app.*",
    "@*.fixture",
    "@tool",
    "@field_validator",
    "@model_validator",
    "@field_serializer",
    "@computed_field",
    "@event.listens_for",
    "@validates",
    "@compiles",
    "@override",
]
ignore_names = [
    # By design: names a framework or a protocol reads.
    "model_config",        # pydantic
    "cache_ok",            # SQLAlchemy TypeDecorator: attributes, methods and their signatures
    "dialect",
    "impl",
    "process_bind_param",
    "process_result_value",
    "pytest_plugins",      # pytest
    "pytestmark",
    "exc_type",            # __exit__ and __aexit__ signatures
    "tb",
    "__getattr__",         # module-level attribute hook
    "ROUTER_*",            # settings named by database/populators/routers.json
    "PROVIDER_*",
    "resume",              # set on a Strands event
    "FAILSAFE",            # set on pyautogui
    "_tracer_instance",    # set on the Strands tracer
    "MINIMAL",             # enum members stored by value
    "LOW",
    "agent_graph_trace",   # ORM relationships and foreign keys
    "agent_graph_trace_id",
    "agent_graph_traces",
    "graph_nodes",
    "recovery_context_id",
    "contract_version",    # fields of the wire and of responses
    "reflections",
    "token_type",
    "ts",
    "_Second",             # tests: a class that must fail to define, fields and attributes of fakes
    "commit_count",
    "ignored_field",
    "mock_s3client_model",
    "severity",
    "tags",
]

[tool.complexipy]
# Cognitive complexity: how hard a function's control flow is to follow.
paths = ["."]
exclude = ["migrations/**"]
max-complexity-allowed = 15
failed = true

